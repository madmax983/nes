[desktop]
rom_path = "./roms/homebrew/homebrew.nes"
window_scale = 3
step_mode = "frame"
cpu_steps_per_frame = 10000
audio_enabled = true
trace_every_frames = 0
metrics_enabled = false
metrics_every_frames = 60
capture_path_template = ""
capture_every_frames = 1

[roms]
smb = "./roms/homebrew/homebrew.nes"
nestest = "./roms/nestest.nes"
blargg_cpu = "./roms/cpu.nes"
bbbradsmith_audio_suite_dir = "./roms/nes-audio-tests/build"
bbbradsmith_audio_golden_dir = "./roms/nes-audio-tests/golden"

[netplay]
enabled = false
relay_addr = "127.0.0.1:4545"
room = "river-city-ransom"
player = 1
input_delay_frames = 2
max_rollback_frames = 240
hash_check_every_frames = 120

# RTA mode profiles are external TOML files.
# Example profile:
#   ./config/rta/profiles/smb-any.example.toml
# Use desktop flags:
#   --rta --rta-profiles-dir ./config/rta/profiles [--rta-profile <id>] [--rta-calibrate]
