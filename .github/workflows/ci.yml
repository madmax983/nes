name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --all-features

      - name: Verus proofs
        shell: pwsh
        run: ./scripts/verus-check.ps1

  no-std:
    name: nes-core (no_std)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # ESP32-C3/C6-class bare-metal target. Xtensa parts (ESP32-S3 and
          # friends) need the esp-rs toolchain fork, but any `no_std` break
          # shows up here first and this target ships with upstream rustc.
          target: riscv32imc-unknown-none-elf

      # Proves the crate builds without `std` at all. The dev-dependencies are
      # hosted-only, so this is a lib-only check by design.
      - name: Build nes-core for a bare-metal target
        run: cargo build -p nes-core --no-default-features --lib --target riscv32imc-unknown-none-elf

      - name: Build nes-core for a bare-metal target (tas)
        run: cargo build -p nes-core --no-default-features --features tas --lib --target riscv32imc-unknown-none-elf

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: unittests
          name: nes-workspace
          use_oidc: true
          fail_ci_if_error: false
