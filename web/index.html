<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NES Web Demo</title>
  <link data-trunk rel="rust" href="../crates/nes-web/Cargo.toml" data-target-name="nes_web">
  <link data-trunk rel="copy-file" href="app.js">
  <link data-trunk rel="copy-file" href="audio-worklet.js">
  <link data-trunk rel="copy-file" href="../roms/homebrew/homebrew.nes">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1116;
      --panel: #171a22;
      --ink: #d7dde9;
      --muted: #8e98ad;
      --accent: #64d2ff;
      --danger: #ff6b6b;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1a2234, var(--bg) 45%);
      color: var(--ink);
      font-family: "Consolas", "Menlo", "Courier New", monospace;
      min-height: 100%;
    }

    .wrap {
      display: grid;
      gap: 16px;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px 24px;
      grid-template-columns: minmax(640px, 1fr) minmax(280px, 340px);
    }

    .screen-panel, .controls-panel {
      border: 1px solid #28324a;
      background: color-mix(in srgb, var(--panel), black 8%);
      box-shadow: 0 12px 28px rgb(0 0 0 / 35%);
    }

    .title {
      margin: 0;
      font-size: 16px;
      padding: 10px 12px;
      border-bottom: 1px solid #28324a;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .screen-host {
      padding: 12px;
    }

    #screen {
      width: 100%;
      max-width: 1024px;
      aspect-ratio: 256 / 240;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #2d3955;
      background: #000;
    }

    .controls-panel {
      display: grid;
      grid-auto-rows: min-content;
    }

    .controls {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    button, input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #3b4666;
      background: #1e2433;
      color: var(--ink);
      padding: 10px;
      font: inherit;
    }

    button:hover {
      border-color: var(--accent);
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: var(--danger);
      color: var(--danger);
    }

    .status {
      margin: 0;
      white-space: pre-wrap;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      border-top: 1px solid #28324a;
      padding: 12px;
      min-height: 120px;
    }

    @media (max-width: 980px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="screen-panel">
      <h1 class="title">NES Web Demo</h1>
      <div class="screen-host">
        <canvas id="screen" width="256" height="240" tabindex="0"></canvas>
      </div>
    </section>

    <aside class="controls-panel">
      <h2 class="title">Controls</h2>
      <div class="controls">
        <input id="rom-file" type="file" accept=".nes,application/octet-stream">
        <button id="load-homebrew" type="button">Load Homebrew ROM</button>
        <button id="toggle-run" type="button" aria-pressed="false">Start</button>
        <button id="step-frame" type="button">Step Frame</button>
        <button id="reset" type="button">Reset</button>
        <button id="audio" type="button">Enable Audio</button>
        <button id="hold-right" type="button" aria-pressed="false">Hold Right: Off</button>
        <button id="capture" type="button">Capture Frame</button>
      </div>
      <pre id="status" class="status">Booting wasm runtime...</pre>
    </aside>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
