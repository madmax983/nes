[package]
name = "nes-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = []
mcp-host = ["dep:nes-mcp", "dep:serde", "dep:serde_json"]

[dependencies]
nes-config = { path = "../nes-config" }
nes-core = { path = "../nes-core" }
nes-mcp = { path = "../nes-mcp", optional = true }
pixels = "0.13"
rodio = "0.17"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
winit = "0.28"
