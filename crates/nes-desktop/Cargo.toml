[package]
name = "nes-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = []
mcp-host = ["dep:nes-mcp"]

[dependencies]
gilrs = "0.10"
nes-config = { path = "../nes-config" }
nes-core = { path = "../nes-core" }
nes-netplay = { path = "../nes-netplay" }
nes-mcp = { path = "../nes-mcp", optional = true }
pixels = "0.13"
rodio = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.28"
