[package]
name = "nes-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = []
mcp-host = ["dep:nes-mcp"]
nova = ["dep:rand", "nes-core/nova", "nes-mcp/nova"]

[dependencies]
gilrs = "0.10"
nes-config = { path = "../nes-config" }
nes-core = { path = "../nes-core" }
rand = { version = "0.8.5", optional = true }
comfy-table = "7.1"
crossterm = "0.28"
nes-netplay = { path = "../nes-netplay" }
nes-rewind = { path = "../nes-rewind" }
nes-mcp = { path = "../nes-mcp", optional = true }
pixels = "0.13"
rodio = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
winit = "0.28"
