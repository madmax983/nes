[package]
name = "nes-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]

# Hosted build. Disable for bare-metal targets (`--no-default-features`), which
# builds the core as `no_std` + `alloc`.
std = ["serde/std"]

# Experimental tooling ("nova"). Uses `std` collections and image encoders.
nova = ["std"]

tas = []

[dependencies]
itoa = "1.0.17"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
proptest = "1.0.0"
serde_json = "1"
divan = "0.1"

[[bench]]
name = "frame_throughput"
harness = false
