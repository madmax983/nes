[package]
name = "nes-relay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.nes-relay]
path = ".."

[[bin]]
name = "parse_args_fuzz"
path = "fuzz_targets/parse_args_fuzz.rs"
test = false
doc = false
bench = false
