[package]
name = "nes-netplay"
version = "0.1.0"
edition = "2024"

[dependencies]
nes-core = { path = "../nes-core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
loom = "0.7.2"
proptest = "1.10.0"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
