[package]
name = "nes-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
nes-netplay = { path = "../crates/nes-netplay" }
nes-core = { path = "../crates/nes-core" }
loom = "0.7.2"
proptest = "1.5.0"
arbitrary = { version = "1.3.2", features = ["derive"] }

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[workspace]
